name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Version tags are released by release.yml.

# Third-party actions are pinned to commit SHAs (version in the trailing comment).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries (windowing + software Vulkan for UI tests, bsdtar and xorrisofs for ISO images, the fonts the interface loads)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers libarchive-tools xorriso zip \
            fonts-noto-core fonts-dejavu-core
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      # With the features of the release packages: JPEG-LS builds CharLS (C++) with CMake,
      # which every runner image has.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features summrise/jpeg-ls -- -D warnings
      - name: Tests
        # All failures in one run: a platform-specific failure should not hide the next one.
        run: cargo test --workspace --locked --no-fail-fast --features summrise/jpeg-ls
        env:
          # Tools the archive tests use that this runner has: missing, they fail instead of skipping.
          SUMMRISE_REQUIRE_TOOLS: ${{ runner.os == 'Linux' && 'mkisofs,zip' || runner.os == 'macOS' && 'ditto,hdiutil,zip' || '' }}

  supply-chain:
    name: Licences & advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Licences, advisories, sources, and the ban on network client crates (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Third-party notices up to date
        run: cargo xtask notices --check

  package:
    name: Package
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/package.yml
    secrets: inherit
