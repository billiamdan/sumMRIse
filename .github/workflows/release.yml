name: Release

# Pushing a version tag (v0.3.0) publishes a GitHub Release with the macOS DMG, the
# Windows MSI and zip, the Linux AppImage and tarball, and SHA256SUMS. The tag must name
# the version in Cargo.toml, be on main and have a section in CHANGELOG.md.
#
# Signing: with the secrets MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGNING_IDENTITY
# (and APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER for notarization) and
# WINDOWS_CERT_PFX, WINDOWS_CERT_PASSWORD, the packages are signed; without them they
# are published unsigned and the release notes say so. The `release` environment can
# be given protection rules (required reviewers) in the repository settings.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag, version and release notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: The tag names the version of the workspace and is on main
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the version in Cargo.toml ($version)."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: CHANGELOG.md has a section for the version
        run: cargo xtask release-notes "${{ steps.version.outputs.version }}" > /dev/null

  package:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    secrets: inherit

  publish:
    name: Publish the release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED_MACOS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
      SIGNED_WINDOWS: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: SumMRIse-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          ls -l
          expected=("SumMRIse-$VERSION-macos-universal.dmg" "SumMRIse-$VERSION-windows-x64.msi"
            "SumMRIse-$VERSION-windows-x64.zip" "SumMRIse-$VERSION-linux-x64.AppImage"
            "SumMRIse-$VERSION-linux-x64.tar.gz")
          for file in "${expected[@]}"; do test -f "$file" || { echo "::error::$file is missing"; exit 1; }; done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Release notes
        run: |
          flags=()
          [ "$SIGNED_MACOS" = true ] && flags+=(--signed-macos)
          [ "$SIGNED_WINDOWS" = true ] && flags+=(--signed-windows)
          cargo xtask release-notes "$VERSION" "${flags[@]}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --title "SumMRIse $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
