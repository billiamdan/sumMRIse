[package]
name = "summrise"
description = "SumMRIse — viewer for MRI and CT studies from patient CDs/DVDs (DICOM)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "summrise"

[[bin]]
name = "summrise"
path = "src/main.rs"

[features]
default = []
# JPEG-LS decoding through CharLS, a C++ library built from source (needs CMake and a
# C++ compiler). Release packages enable it; developer builds work without it.
jpeg-ls = ["summrise-dicom/jpeg-ls"]

[dependencies]
anyhow.workspace = true
eframe.workspace = true
env_logger.workspace = true
log.workspace = true
# Only for the `jpeg-ls` feature: the decoders live in summrise-dicom.
summrise-dicom.workspace = true
summrise-ui.workspace = true

[lints]
workspace = true
