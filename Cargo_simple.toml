[package]
name = "summrise_simple"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "summrise_simple"
path = "src/main_simple.rs"

[dependencies]
gtk4 = "0.7"
cairo-rs = "0.18"
dicom = "0.5"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
glib = "0.18"
gio = "0.18"

# Workspace crates
summrise-core = { path = "crates/core" }
summrise-dicom = { path = "crates/dicom" }

