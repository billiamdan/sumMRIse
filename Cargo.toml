[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*", "xtask"]
# `cargo build` / `cargo test` at the root skip the xtask helper.
default-members = ["apps/desktop", "crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["billiamdan"]
repository = "https://github.com/billiamdan/sumMRIse"
publish = false

[workspace.dependencies]
# Internal crates
summrise-core = { path = "crates/core" }
summrise-dicom = { path = "crates/dicom" }
summrise-i18n = { path = "crates/i18n" }
summrise-imaging = { path = "crates/imaging" }
summrise-testkit = { path = "crates/testkit" }
summrise-ui = { path = "crates/ui" }

# DICOM (pure Rust: dicom-rs)
dicom-core = "0.10.1"
dicom-dictionary-std = "0.10.1"
dicom-encoding = "0.10.1"
dicom-object = "0.10.1"
# The token stream under dicom-object: it is not recursive, so it can tell that a file nests too
# deeply for the object parser (report-viewer). Not a new crate in the tree.
dicom-parser = "0.10.1"
# `native` = baseline/extended JPEG, RLE, deflate; `openjp2` = pure-Rust JPEG 2000.
dicom-pixeldata = { version = "0.10.1", default-features = false, features = ["rayon", "native", "openjp2"] }
dicom-transfer-syntax-registry = "0.10.1"

# UI
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = "0.37"
egui_material_icons = { version = "0.9", default-features = false, features = ["outline"] }
rfd = "0.17"

# General purpose
anyhow = "1.0.104"
env_logger = "0.11.11"
# A TrueType font for the synthetic PDF with an embedded font (report-viewer, testkit only). Not a
# new crate in the tree: egui's text layout uses it already.
epaint_default_fonts = "0.37"
# The code pages of RTF, HTML and text documents (report-viewer): Windows code pages, Shift-JIS, GBK…
# Pure Rust, maintained; `encoding`, which dicom-rs uses, is unmaintained.
encoding_rs = "0.8.35"
# Deflate for the synthetic ZIP archives the testkit writes (archive-import) and the pictures
# of exported PDF pages (export-and-share). Not a new crate in the tree: dicom-rs, png and zip
# use it already.
flate2 = "1.1.10"
glam = "0.34.2"
# PDF pages inside the application (report-viewer, design.md D3): pure Rust, forbids unsafe code,
# does not touch the disk or the network. The default features embed the 14 standard fonts and the
# predefined CMaps, which PDFs may rely on without embedding them.
hayro = "0.9.0"
# `jpeg` for exported pictures (export-and-share): the encoder is part of `image`, and its
# decoder crate (zune-jpeg) is in the tree already through dicom-rs.
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg"] }
log = "0.4.35"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
# The languages the operating system prefers, for the "System language" setting (translations).
# Not a new crate in the tree: eframe's system-font provider uses it already.
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
walkdir = "2.5.0"
# ZIP downloads of patient discs are read in memory, never unpacked (archive-import).
# Only what reading stored, deflate and deflate64 entries needs: no encryption, no other
# methods, no dates. `deflate-flate2-zlib-rs` is deflate through flate2 with its pure-Rust
# zlib-rs back-end, which the dependency tree holds already.
zip = { version = "9.4.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Image decoding, MPR resampling and egui are far too slow unoptimised; keep
# dev builds snappy while still debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
