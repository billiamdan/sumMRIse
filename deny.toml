# cargo-deny: supply-chain checks for a medical-imaging application.
# Run with `cargo deny --all-features check` (CI runs it on every push).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Security vulnerabilities always fail. "Unmaintained" notices fail only for
# crates the workspace depends on directly; transitive ones are tracked here and
# upstream (re-check when bumping dicom-rs or egui):
#   encoding         RUSTSEC-2021-0153  <- dicom-encoding (dicom-rs text decoding)
#   ttf-parser       RUSTSEC-2026-0192  <- ab_glyph <- sctk-adwaita <- winit (Wayland decorations)
#   zbus_names, zvariant, zvariant_derive
#                    RUSTSEC-2026-0370..0372 <- zbus <- AccessKit AT-SPI / xdg portals (Linux)
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences plus the bundled egui font licences. No GPL/LGPL: every
# dual-licensed crate in the graph offers a permissive alternative.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "IJG",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies without a version requirement; they are
# never published (`publish = false`), so path wildcards are safe.
allow-wildcard-paths = true
# SumMRIse opens no network connection (privacy spec "No network client
# dependencies"): HTTP, WebSocket and TLS client crates may not enter the graph,
# not even through another dependency.
deny = [
    { name = "attohttpc", reason = "HTTP client: SumMRIse has no network access" },
    { name = "curl", reason = "HTTP client: SumMRIse has no network access" },
    { name = "curl-sys", reason = "HTTP client: SumMRIse has no network access" },
    { name = "ehttp", reason = "HTTP client: SumMRIse has no network access" },
    { name = "h2", reason = "HTTP/2 client: SumMRIse has no network access" },
    { name = "hyper", reason = "HTTP client: SumMRIse has no network access" },
    { name = "hyper-util", reason = "HTTP client: SumMRIse has no network access" },
    { name = "isahc", reason = "HTTP client: SumMRIse has no network access" },
    { name = "minreq", reason = "HTTP client: SumMRIse has no network access" },
    { name = "native-tls", reason = "TLS client: SumMRIse has no network access" },
    { name = "openssl", reason = "TLS client: SumMRIse has no network access" },
    { name = "openssl-sys", reason = "TLS client: SumMRIse has no network access" },
    { name = "reqwest", reason = "HTTP client: SumMRIse has no network access" },
    { name = "rustls", reason = "TLS client: SumMRIse has no network access" },
    { name = "surf", reason = "HTTP client: SumMRIse has no network access" },
    { name = "tungstenite", reason = "WebSocket client: SumMRIse has no network access" },
    { name = "ureq", reason = "HTTP client: SumMRIse has no network access" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
