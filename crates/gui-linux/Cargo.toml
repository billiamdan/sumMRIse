[package]
name = "summrise-gui-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.7"
gdk4 = "0.7"
gio = "0.19"
glib = "0.19"
cairo-rs = "0.19"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }

# Re-export other crates
summrise-core = { path = "../core" }
summrise-rendering = { path = "../rendering" }

