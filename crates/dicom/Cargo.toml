[package]
name = "summrise-dicom"
description = "DICOM media import for SumMRIse: DICOMDIR/folder discovery, header indexing, pixel decoding and metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# JPEG-LS via the CharLS C++ library (needs CMake and a C++ toolchain).
jpeg-ls = ["dicom-pixeldata/charls"]
# JPEG XL via the pure-Rust jxl-oxide decoder.
jpeg-xl = ["dicom-pixeldata/jxl-oxide"]

[dependencies]
dicom-core.workspace = true
dicom-dictionary-std = { workspace = true, features = ["sop-class"] }
dicom-encoding.workspace = true
dicom-object.workspace = true
dicom-pixeldata.workspace = true
dicom-transfer-syntax-registry.workspace = true
glam.workspace = true
log.workspace = true
rayon.workspace = true
summrise-i18n.workspace = true
summrise-imaging.workspace = true
thiserror.workspace = true
walkdir.workspace = true
zip.workspace = true

[dev-dependencies]
summrise-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
