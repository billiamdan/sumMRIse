[package]
name = "summrise-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
config = "0.14"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
